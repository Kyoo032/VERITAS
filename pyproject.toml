[project]
name = "supgate"
version = "0.1.0"
description = "VERITAS supplier assurance CLI for black-box evaluation of OpenAI-compatible endpoints"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
supgate = "supgate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["supgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"supgate/cli.py" = ["B008"]  # typer Option/Argument in defaults is the typer pattern
"supgate/passdsl.py" = ["N802"]  # _F_* names mirror the DSL function registry keys
"tests/fake_server.py" = ["N802"]  # test fixture helper names
